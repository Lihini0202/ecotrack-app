# .github/workflows/deploy.yml

name: Deploy to Fly.io

# Manual trigger only. The Fly.io organisation backing this app is currently
# suspended, so a deploy on every push to dev/staging/prod would fail every
# time. Restore automatic deployment by uncommenting the `push` block once
# the Fly account is active again.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - dev
  #     - staging
  #     - prod

permissions:
  contents: read

jobs:
  # Deploys to dev, staging and prod pass the same gate ci.yml applies to
  # main: the full test suite, lint and dependency audit all run here before
  # the deploy job is allowed to start.
  verify:
    name: Tests and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongod-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-mongod-

      - run: npm ci
        working-directory: ./backend

      - run: npm run test:unit
        working-directory: ./backend

      - run: npm run test:integration
        working-directory: ./backend

      - run: npm run test:e2e
        working-directory: ./backend

      - run: npx eslint .
        working-directory: ./backend

      - run: npm audit --audit-level=moderate
        working-directory: ./backend

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly.io
        uses: superfly/flyctl-actions@1.3
        with:
          # Deploy from ./backend so the build context matches the relative
          # COPY paths in backend/Dockerfile. The previous
          # `--config backend/fly.toml` form used the repo root as context,
          # where there is no Dockerfile at all.
          args: "deploy --remote-only ./backend"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_APP }}
