name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: ./backend

      - run: npm run test:unit
        working-directory: ./backend

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: backend/reports/unit
          if-no-files-found: error

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # mongodb-memory-server downloads a mongod binary on first use.
      # Caching it keeps the integration job off the network on reruns.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongod-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-mongod-

      - run: npm ci
        working-directory: ./backend

      - run: npm run test:integration
        working-directory: ./backend

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: backend/reports/integration
          if-no-files-found: error

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongod-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-mongod-

      - run: npm ci
        working-directory: ./backend

      - run: npm run test:e2e
        working-directory: ./backend

      - name: Upload e2e coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: backend/reports/e2e
          if-no-files-found: error

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: ./backend

      # Both steps are gates: a lint error or a moderate-or-higher advisory
      # fails the job, and the deploy job below will not run.
      - name: Lint code (SAST)
        run: npx eslint .
        working-directory: ./backend

      - name: Run dependency check (SCA)
        run: npm audit --audit-level=moderate
        working-directory: ./backend

  docker-build:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches Dockerfile breakage before the deploy job discovers it in
      # front of production.
      - name: Build image
        run: docker build -t ecotrack-backend:${{ github.sha }} ./backend

  observability:
    name: Observability
    runs-on: ubuntu-latest
    steps:
      - name: Log tracing placeholder
        run: echo "Send custom metrics to OpenTelemetry / DataDog / Prometheus here"

  # Deployment lives in deploy.yml, which runs the same gates and then
  # releases on demand. It is kept off the push path because the Fly.io
  # organisation backing this app is suspended, so an automatic deploy can
  # only ever fail and would mark every commit on main as broken while the
  # tests, lint, audit and image build above are all passing.
  deploy:
    name: Deploy to Fly.io
    needs: [unit, integration, e2e, security, docker-build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.3
        with:
          args: deploy --remote-only ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_APP }}
